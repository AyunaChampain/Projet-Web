    <fieldset class="quiz">
        <legend>Quiz time !</legend>
        <ul>
                <li>
                    <label for="q1r1">Combien il y a t-il d'espèces de requins en danger ?&nbsp;:</label>
                    <div>
                        <input type="radio" id="q1r1" name="especes" value="def1" >
                        <label for="q1r1">167</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r2" name="especes" value="def2">
                        <label for="q1r2">3millions</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r3" name="especes" value="def3">
                        <label for="q1r3">245</label>
                    </div>
                </li>

                <li>
                    <label for="q2r1">Comment s'appelle notre mascotte ?&nbsp;:</label>
                    <input type="text" id="nom" name="exempleIT">
                </li>

                <li>
                <label for="exemple">De quelle couleur est-il ?&nbsp;:</label>
                <input type="text" id="color" name="exempleIT">
                </li>

                <li>
                    <label for="q1r1">Combien d'espèces de poissons sont actuellement reconnues ?&nbsp;:</label>
                    <div>
                        <input type="radio" id="q4r1" name="nb" value="def1">
                        <label for="q1r1">100</label>
                    </div>

                    <div>
                        <input type="radio" id="q4r2" name="nb" value="def2">
                        <label for="q1r2">Environ 10 000</label>
                    </div>

                    <div>
                        <input type="radio" id="q4r3" name="nb" value="def3">
                        <label for="q1r3">Environ 28 000</label>
                    </div>
                </li>

                <li>
                    <label for="q5r1">Quelle est la principale caractéristique des poissons ?&nbsp;:</label>
                    <div>
                        <input type="radio" id="q1r1" name="cara" value="def1">
                        <label for="q5r1">Ils sont carnivores</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r2" name="cara" value="def2">
                        <label for="q5r2">Ils ont des poumons</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r3" name="cara" value="def3">
                        <label for="q5r3"> Ils ont des branchies et des nageoires</label>
                    </div>
                </li>

                <li>
                    <label for="q1r1">Quel pourcentage des poissons d’eau douce évalués par l’UICN en 2023 est considéré comme menacé ?&nbsp;:</label>
                    <div>
                        <input type="radio" id="q1r1" name="douce" value="def1">
                        <label for="q1r1">10%</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r2" name="douce" value="def2">
                        <label for="q1r2">25%</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r3" name="douce" value="def3">
                        <label for="q1r3">50%</label>
                    </div>
                </li>

                <li>
                    <label for="q1r1">C'est quoi le shark finning ?&nbsp;:</label>
                    <div>
                        <input type="radio" id="q1r1" name="sf" value="def1">
                        <label for="q1r1">La chasse aux oeufs de requins</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r2" name="sf" value="def2">
                        <label for="q1r2">La destruction de leur habitat</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r3" name="sf" value="def3">
                        <label for="q1r3">La coupe de leurs ailerons puis leur rejet à la mer</label>
                    </div>
                </li>

                <li>
                    <label for="q1r1">Pourquoi les raies sont particulièrement vulnérables à la surpêche ?&nbsp;:</label>
                    <div>
                        <input type="radio" id="q1r1" name="vulne" value="def1">
                        <label for="q1r1">Elles vivent à la surface</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r2" name="vulne" value="def2">
                        <label for="q1r2">Elles se reproduisent lentement</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r3" name="vulne" value="def3">
                        <label for="q1r3">Elles attaquent les filets de pêche</label>
                    </div>
                </li>

                <li>
                    <label for="q1r1">Quelle est une des principales causes de mortalité chez les céacés&nbsp;:</label>
                    <div>
                        <input type="radio" id="q1r1" name="mort" value="def1">
                        <label for="q1r1">Les attaques de requin</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r2" name="mort" value="def2">
                        <label for="q1r2">Les températures froides</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r3" name="mort" value="def3">
                        <label for="q1r3">Les captures accidentelles dans les filets</label>
                    </div>
                </li>

                <li>
                    <label for="q1r1">Pourquoi les cétacés ne sont pas des poissons ?&nbsp;:</label>
                    <div>
                        <input type="radio" id="q1r1" name="cetaces" value="def1">
                        <label for="q1r1">Ce sont des amphibiens</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r2" name="cetaces" value="def2">
                        <label for="q1r2">Ce sont des mammifères</label>
                    </div>

                    <div>
                        <input type="radio" id="q1r3" name="cetaces" value="def3">
                        <label for="q1r3">Ils sont grands</label>
                    </div>
                </li>


            </ul>
            <button id="bouton"class="container" type="submit" onclick="SubmitQuiz()">Envoyer</button>
    
        </fieldset>
